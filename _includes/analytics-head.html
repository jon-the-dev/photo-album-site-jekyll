{% assign google_analytics_id = site.google_analytics_id | default: '' | strip %}
{% if google_analytics_id != '' %}
    <link rel="preconnect" href="https://www.googletagmanager.com">
    <link rel="preconnect" href="https://www.google-analytics.com">
    <script>
      window.spooledAnalyticsConfig = {
        measurementId: {{ google_analytics_id | jsonify }},
        requireConsent: {% if site.google_analytics_require_consent == false %}false{% else %}true{% endif %}
      };
    </script>
{% endif %}
