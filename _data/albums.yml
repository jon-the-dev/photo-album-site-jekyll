albums:
  - slug: the-long-way-north
    title: The Long Way North
    location: Northern latitudes
    year: "2026"
    season: Late autumn
    words_by: Still / Wild
    cover: /assets/images/north/01-road-to-north.webp
    cover_alt: A single road winding through steep green mountains under low cloud
    dek: A visual journal about taking the slower road into weather, silence, and the wide-open north.
    intro: We left before first light with a paper map, two cameras, and nowhere we absolutely needed to be.
    story: For twelve days the road moved between black water and high country. Rain erased the horizon. Then the clouds would lift without warning, revealing a landscape so enormous it made every plan feel small. These frames are less a record of arrival than a study of everything that happened along the way.
