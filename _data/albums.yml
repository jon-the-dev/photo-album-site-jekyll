albums:
  - slug: noise-and-speed-metal
    title: Noise & Speed Metal
    location: TerraCrew
    year: "2025"
    season: Race day
    words_by: Jon Price
    cover: /assets/images/speed-metal/01-dusk-lights.webp
    cover_mobile: /assets/images/speed-metal/01-dusk-lights-960.webp
    cover_alt: An off-road race truck glowing under green lights at dusk
    dek: Eight frames from a day of big air, hard landings, dust, and the people who keep the show moving.
    intro: The loudest machines still give you a split second of silence when all four tires leave the ground.
    story: Speed Metal moves fast. Trucks trade dust for air, crews reset between runs, and the high desert light changes by the lap. This small edit is not the whole event—it is a first look at the moments that felt suspended inside all that noise.
