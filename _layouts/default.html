<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#171713">
    <meta name="description" content="{{ page.description | default: site.description }}">

    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="{{ '/assets/images/speed-metal/01-dusk-lights.webp' | relative_url }}" type="image/webp">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.asset_version }}">

    <script>document.documentElement.classList.add('js');</script>
  </head>
  <body class="{{ page.body_class }}">
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header" data-header>
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Spooled Pixels home">
        <span>Spooled</span><i aria-hidden="true"></i><span>Pixels</span>
      </a>

      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" data-nav-toggle>
        <span class="sr-only">Toggle navigation</span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>

      <nav class="site-nav" id="site-navigation" aria-label="Primary navigation" data-nav>
        <a href="{{ '/' | relative_url }}#work">Selected work</a>
        <a href="{{ '/albums/noise-and-speed-metal/' | relative_url }}">Journal</a>
        <a href="{{ '/' | relative_url }}#about">About</a>
      </nav>
    </header>

    <main id="main-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <a class="wordmark wordmark--footer" href="{{ '/' | relative_url }}">
        <span>Spooled</span><i aria-hidden="true"></i><span>Pixels</span>
      </a>
      <p>Off-road stories from the split second between dirt and sky.</p>
      <div class="footer-meta">
        <a href="https://www.instagram.com/spooled.pixels/" rel="noreferrer">@spooled.pixels</a>
        <span>© {{ 'now' | date: '%Y' }} Jon Price</span>
      </div>
    </footer>

    <dialog class="lightbox" id="lightbox" aria-label="Image viewer">
      <button class="lightbox__close" type="button" data-lightbox-close>
        <span class="sr-only">Close image viewer</span>
        <span aria-hidden="true">×</span>
      </button>
      <button class="lightbox__nav lightbox__nav--prev" type="button" data-lightbox-prev>
        <span aria-hidden="true">←</span><span class="sr-only">Previous image</span>
      </button>
      <figure class="lightbox__figure">
        <img src="" alt="" data-lightbox-image>
        <span class="media-mark media-mark--lightbox" aria-hidden="true">@spooled.pixels</span>
        <figcaption data-lightbox-caption></figcaption>
      </figure>
      <button class="lightbox__nav lightbox__nav--next" type="button" data-lightbox-next>
        <span aria-hidden="true">→</span><span class="sr-only">Next image</span>
      </button>
    </dialog>

    <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.asset_version }}" defer></script>
  </body>
</html>
